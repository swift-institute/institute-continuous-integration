# SwiftLint configuration for institute-continuous-integration
# Inherits from the Tier 1 ecosystem-wide canonical.

parent_config: https://raw.githubusercontent.com/swift-institute/.github/main/.swiftlint.yml

# The validator fixture corpus under Tests/**/Fixtures/** is deliberately
# defective data: `fail/` scenarios exist precisely to violate the rules
# their validators detect. Linting a corpus of intentional violations and
# failing on them is not a finding about this repository's code — same
# rationale as swift-institute/Issues excluding its `evidence/` reproducer
# corpus. The package already declares the same directories as SwiftPM
# resources/excludes (Package.swift `exclude: ["Fixtures"]`); this mirrors
# that intent for the style-lint leg. See #4.
excluded:
  - .build
  - "**/.build"
  - "Tests/**/Fixtures/**"
