# Publish the Swift owner of repository-policy effects independently from the
# universal CI executable. Consumers resolve CURRENT, then download and verify
# the immutable digest-named bundle before invoking it.

name: publish-repository-policy-binary

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - 'Sources/Repository Policy/**'
      - 'Sources/Repository Policy CLI/**'
      - 'Tests/Repository Policy Tests/**'
      - '.github/workflows/publish-repository-policy-binary.yml'
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:

concurrency:
  group: publish-repository-policy-binary
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: swift:6.3@sha256:69bf1f0281e13d82c9e49d67c2dd1dcc8c00bad738c860f4323d7078787ec8ea # 6.3.3
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision publisher dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -qq -y curl ca-certificates gnupg git uuid-dev
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /tmp/gh-keyring.gpg
          echo "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b  /tmp/gh-keyring.gpg" | sha256sum -c -
          mv /tmp/gh-keyring.gpg /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -qq -y gh

      - name: Compute composite identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          : > /tmp/heads
          for dependency in \
            swift-foundations/swift-ascii \
            swift-foundations/swift-continuous-integration \
            swift-foundations/swift-github-continuous-integration \
            swift-foundations/swift-package-manager \
            swift-standards/swift-github-standard \
            swift-primitives/swift-byte-primitives \
            swift-standards/swift-fips-180-4
          do
            head="$(git ls-remote "https://github.com/${dependency}.git" main | cut -f1)"
            [ -n "$head" ] || { echo "::error::no main HEAD for ${dependency}"; exit 1; }
            echo "${dependency}=${head}" >> /tmp/heads
          done
          digest="$( { echo "$GITHUB_SHA"; cut -d= -f2 /tmp/heads; } | sort | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "digest=$digest"
            echo "source-revision=$GITHUB_SHA"
            echo "toolchain=swift-6.3"
            echo "container=swift:6.3@sha256:69bf1f0281e13d82c9e49d67c2dd1dcc8c00bad738c860f4323d7078787ec8ea"
            echo "os=linux"
            echo "arch=x86_64"
            echo "provisioning=static-swift-stdlib,uuid-dev"
            echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat /tmp/heads
          } > /tmp/MANIFEST
          cat /tmp/MANIFEST

      - name: Check current pointer
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.identity.outputs.digest }}
        run: |
          set -euo pipefail
          stale=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            current="$(gh release download repository-policy-binaries --pattern CURRENT --output - 2>/dev/null || true)"
            if [ "$current" = "$DIGEST" ]; then
              stale=false
              echo "Published repository-policy identity is current."
            fi
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      - name: Build repository-policy
        if: ${{ steps.freshness.outputs.stale == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product repository-policy --static-swift-stdlib
          install -m 0755 .build/release/repository-policy /tmp/repository-policy

      - name: Prove repository-policy executable
        if: ${{ steps.freshness.outputs.stale == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/repository-policy render-caller --form terminal > /tmp/terminal-caller.yml
          test -s /tmp/terminal-caller.yml
          grep -F 'name: ci / matrix' /tmp/terminal-caller.yml
          grep -F 'uses: swift-institute/.github/.github/workflows/swift-ci.yml@main' /tmp/terminal-caller.yml
          grep -F 'github.event.repository.private' /tmp/terminal-caller.yml

      - name: Publish immutable bundle and advance CURRENT last
        if: ${{ steps.freshness.outputs.stale == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.identity.outputs.digest }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          stage="$(mktemp -d)"
          binary="repository-policy-${DIGEST}"
          manifest="repository-policy-${DIGEST}.manifest"
          checksums="repository-policy-${DIGEST}.sha256"
          install -m 0755 /tmp/repository-policy "$stage/$binary"
          cp /tmp/MANIFEST "$stage/$manifest"
          (cd "$stage" && sha256sum "$binary" "$manifest" > "$checksums")
          (cd "$stage" && sha256sum -c "$checksums")

          if ! gh release view repository-policy-binaries >/dev/null 2>&1; then
            gh release create repository-policy-binaries \
              --prerelease --latest=false \
              --title 'Repository Policy binaries (rolling pointer)' \
              --notes 'Immutable digest-named repository-policy bundles. CURRENT is advanced only after all bundle assets verify.' \
              --target "$GITHUB_SHA"
          fi

          for asset in "$binary" "$manifest" "$checksums"; do
            if gh release view repository-policy-binaries \
              --json assets --jq '.assets[].name' | grep -Fxq "$asset"
            then
              gh release download repository-policy-binaries \
                --pattern "$asset" --dir "$stage/readback"
              cmp "$stage/$asset" "$stage/readback/$asset"
            else
              gh release upload repository-policy-binaries "$stage/$asset"
            fi
          done

          readback="$(mktemp -d)"
          gh release download repository-policy-binaries \
            --pattern "$binary" --pattern "$manifest" --pattern "$checksums" \
            --dir "$readback"
          (cd "$readback" && sha256sum -c "$checksums")
          cmp "$stage/$manifest" "$readback/$manifest"

          printf '%s\n' "$DIGEST" > "$stage/CURRENT"
          gh release upload repository-policy-binaries "$stage/CURRENT" --clobber
          resolved="$(gh release download repository-policy-binaries --pattern CURRENT --output -)"
          [ "$resolved" = "$DIGEST" ]
          echo "Published repository-policy source=$GITHUB_SHA digest=$DIGEST"
